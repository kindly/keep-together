name: Deploy

# Every push to main: the CI checks, then the image to keep-staging (Fly,
# lhr), which resets itself to the riverside seed. Prod (keep-prod) is
# deployed only by hand: Run workflow with env=prod. It refuses until the
# variable PROD_URL is set, which scripts/fly/prod.sh tells the human to
# do once keep-prod exists.
#
# Needs: secret FLY_API_TOKEN in each GitHub environment (`fly tokens
# create deploy -a keep-<env>`), variables STAGING_URL and PROD_URL, and
# optionally SENTRY_DSN_SPA (the SPA's Sentry DSN, public by design) —
# scripts/fly/{staging,prod}.sh print the commands.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-${{ inputs.env || 'staging' }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'staging' }}
    steps:
      - name: Prod exists
        if: ${{ inputs.env == 'prod' && vars.PROD_URL == '' }}
        run: |
          echo "::error::keep-prod isn't set up: run scripts/fly/prod.sh, then gh variable set PROD_URL."
          exit 1
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # --ha=false: one machine, one volume. Two would each replicate
      # their own platform.db to the same Litestream prefix.
      - name: Deploy keep-${{ inputs.env || 'staging' }}
        run: >
          flyctl deploy -c "fly.$DEPLOY_ENV.toml" --remote-only --yes --ha=false
          --build-arg VITE_SENTRY_DSN="$SENTRY_DSN_SPA"
          --build-arg VITE_RELEASE="$GITHUB_SHA"
        env:
          DEPLOY_ENV: ${{ inputs.env || 'staging' }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_DSN_SPA: ${{ vars.SENTRY_DSN_SPA }}
      - name: Smoke test
        run: |
          for i in $(seq 30); do
            if body=$(curl -fsS --max-time 5 "$URL/healthz"); then
              echo "$body"
              curl -fsS --max-time 5 "$URL/" | grep -q '<div id="app">'
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/healthz did not come up"
          exit 1
        env:
          URL: ${{ inputs.env == 'prod' && vars.PROD_URL || vars.STAGING_URL }}
