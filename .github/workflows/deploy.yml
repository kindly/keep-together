name: Deploy

# Every push to main: the CI checks, then the image to keep-staging (Fly,
# lhr), which resets itself to the riverside seed, and to keep-qc (QC's
# own app, plan gocardless-sandbox-qc.sv, wiped on every deploy too).
# deploy-qc skips, green, until the GitHub environment `qc` has the
# variable QC_URL, which the human sets after keep-qc's first deploy
# (scripts/fly/qc.sh prints the command). Prod (keep-prod) is deployed
# only by hand: Run workflow with env=prod, from main. It refuses any
# other branch, and refuses until the variable PROD_URL is set, which
# scripts/fly/prod.sh tells the human to do once keep-prod exists.
#
# Needs: secret FLY_API_TOKEN (`fly tokens create deploy -a keep-<env>`):
# staging's is repo-wide (scripts/fly/staging.sh), prod's is set on the
# GitHub environment `prod` (scripts/fly/prod.sh) and keep-qc's on the
# environment `qc` (scripts/fly/qc.sh), each overriding the repo-wide one
# for its job. Variables STAGING_URL, PROD_URL, QC_URL (on `qc`), and
# optionally SENTRY_DSN_SPA (the SPA's Sentry DSN, public by design).
# The scripts print the commands. The images carry
# KEEP_RELEASE=$GITHUB_SHA, which /healthz reports as `commit`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [staging, qc, prod]
        default: staging

concurrency:
  group: deploy-${{ inputs.env || 'staging' }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    if: ${{ inputs.env != 'qc' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'staging' }}
    steps:
      - name: Prod exists
        if: ${{ inputs.env == 'prod' && vars.PROD_URL == '' }}
        run: |
          echo "::error::keep-prod isn't set up: run scripts/fly/prod.sh, then gh variable set PROD_URL."
          exit 1
      # Real data: only what main holds, never a branch picked in the form.
      - name: Prod deploys main only
        if: ${{ inputs.env == 'prod' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::prod deploys only from main (this run is on $GITHUB_REF)."
          exit 1
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # --ha=false: one machine, one volume. Two would each replicate
      # their own platform.db to the same Litestream prefix.
      - name: Deploy keep-${{ inputs.env || 'staging' }}
        run: >
          flyctl deploy -c "fly.$DEPLOY_ENV.toml" --remote-only --yes --ha=false
          --build-arg VITE_SENTRY_DSN="$SENTRY_DSN_SPA"
          --build-arg VITE_RELEASE="$GITHUB_SHA"
          --build-arg KEEP_RELEASE="$GITHUB_SHA"
        env:
          DEPLOY_ENV: ${{ inputs.env || 'staging' }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_DSN_SPA: ${{ vars.SENTRY_DSN_SPA }}
      - name: Smoke test
        run: |
          for i in $(seq 30); do
            if body=$(curl -fsS --max-time 5 "$URL/healthz"); then
              echo "$body"
              curl -fsS --max-time 5 "$URL/" | grep -q '<div id="app">'
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/healthz did not come up"
          exit 1
        env:
          URL: ${{ inputs.env == 'prod' && vars.PROD_URL || vars.STAGING_URL }}

  # keep-qc: QC's own app, wiped and reseeded on every deploy. On every
  # push to main, or by hand with env=qc (main only: the environment's
  # branch policy refuses anything else too). Shares the concurrency group
  # `keep-qc` with QC's workflow, so a deploy never lands mid-run.
  deploy-qc:
    needs: checks
    if: ${{ github.event_name == 'push' || inputs.env == 'qc' }}
    runs-on: ubuntu-latest
    environment: qc
    concurrency:
      group: keep-qc
      cancel-in-progress: false
    steps:
      # QC_URL lives on the environment, so a job-level `if` can't see it:
      # this step decides, and every later step follows. Unset (before
      # the human has set keep-qc up) is a skip, not a failure.
      - name: keep-qc set up?
        id: gate
        run: |
          if [ -z "$QC_URL" ]; then
            echo "::notice::keep-qc isn't set up yet (no QC_URL on the qc environment): skipping. scripts/fly/qc.sh, docs/ops.md \"keep-qc\"."
            echo "go=false" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::keep-qc deploys only from main (this run is on $GITHUB_REF)."
            exit 1
          else
            echo "go=true" >>"$GITHUB_OUTPUT"
          fi
        env:
          QC_URL: ${{ vars.QC_URL }}
      - if: ${{ steps.gate.outputs.go == 'true' }}
        uses: actions/checkout@v4
      - if: ${{ steps.gate.outputs.go == 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy keep-qc
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: >
          flyctl deploy -c fly.qc.toml --remote-only --yes --ha=false
          --build-arg VITE_SENTRY_DSN="$SENTRY_DSN_SPA"
          --build-arg VITE_RELEASE="$GITHUB_SHA"
          --build-arg KEEP_RELEASE="$GITHUB_SHA"
        env:
          # The qc environment's own token (a keep-qc deploy token).
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_DSN_SPA: ${{ vars.SENTRY_DSN_SPA }}
      # Up, and serving this commit: QC reads /healthz's commit to check
      # out the specs that match the app.
      - name: Smoke test
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: |
          for i in $(seq 30); do
            if body=$(curl -fsS --max-time 5 "$QC_URL/healthz") &&
              [ "$(printf '%s' "$body" | jq -r '.commit // empty')" = "$GITHUB_SHA" ]; then
              echo "$body"
              curl -fsS --max-time 5 "$QC_URL/" | grep -q '<div id="app">'
              exit 0
            fi
            sleep 5
          done
          echo "::error::$QC_URL/healthz did not come up on $GITHUB_SHA (last: ${body:-none})"
          exit 1
        env:
          QC_URL: ${{ vars.QC_URL }}
