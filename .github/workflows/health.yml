name: Health

# Every 15 minutes: each live environment's /healthz. A failure opens a
# GitHub issue labelled `health` (GitHub emails it), or comments on the
# open one, so an outage is one thread. Failing means: not 200 / ok false,
# the last hourly snapshot older than 2 h (or none), snapshot errors,
# Litestream not ok or lagging more than LITESTREAM_MAX_LAG seconds
# (variable, default 300), a restore that needs a look (a fallback to
# the snapshots, or orgs left out), or the data volume under 20% free
# ("disk 80% full on <env>"), and URGENT under 10% (the issue's title
# says so, and it gets the `urgent` label). The checks are
# scripts/ops/health-problems.jq. /healthz carries counts only; the
# details are in the app's log and Sentry. What to do: docs/ops.md.
#
# Variables: STAGING_URL now, PROD_URL from cutover.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # For scripts/ops/health-problems.jq, the judgement (tested by
      # scripts/ops/health-problems.test.mjs).
      - uses: actions/checkout@v4
      - name: Check /healthz
        id: check
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          PROD_URL: ${{ vars.PROD_URL }}
          MAX_LAG: ${{ vars.LITESTREAM_MAX_LAG || '300' }}
        run: |
          problems=""
          for pair in "staging $STAGING_URL" "prod $PROD_URL"; do
            set -- $pair
            env=$1 url=${2:-}
            [ -n "$url" ] || continue
            if ! body=$(curl -fsS --max-time 10 "$url/healthz"); then
              problems="$problems\n- **$env**: $url/healthz unreachable or not 200"
              continue
            fi
            echo "$env: $body"
            why=$(jq -r --argjson max "$MAX_LAG" --arg env "$env" \
              -f scripts/ops/health-problems.jq <<<"$body")
            [ -z "$why" ] || problems="$problems\n- **$env**: $why"
          done
          {
            echo "problems<<EOF"
            printf '%b\n' "$problems"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
          [ -z "$problems" ]
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create health --color B60205 --description "health.yml alerts" 2>/dev/null || true
          body=$(printf '%s\n\n%s\n' "${PROBLEMS:-the check itself failed}" "Run: $RUN")
          title="Health check failing ($(date -u +%Y-%m-%dT%H:%MZ))"
          urgent=""
          if grep -q 'URGENT:' <<<"$PROBLEMS"; then
            urgent=1
            title="URGENT: disk nearly full ($(date -u +%Y-%m-%dT%H:%MZ))"
            gh label create urgent --color 000000 --description "health.yml: act now" 2>/dev/null || true
          fi
          open=$(gh issue list --label health --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
            if [ -n "$urgent" ]; then
              gh issue edit "$open" --add-label urgent --title "$title"
            fi
          else
            gh issue create --label health ${urgent:+--label urgent} --title "$title" --body "$body"
          fi
