name: QC

# The QC suite (qc/README.md) against keep-qc, QC's own app, from GitHub's
# runners (plan factory/plans/gocardless-sandbox-qc.sv, A2; docs/ops.md
# "keep-qc" and "Nightly QC"). After every successful Deploy of a push
# to main (`workflow_run`), nightly at 03:00 UTC, and by hand (Run
# workflow; mode=record measures and judges nothing, for recording
# budgets: plan step A3).
#
# This repo is public, so everything here is written for that:
# - **No pull-request trigger of either kind**, ever: nothing from a fork
#   or a branch reaches the job (workflow.test.mjs refuses the word). It
#   runs only on `main`: the `qc` job refuses any other ref (the `refuse`
#   job fails loudly instead), and the GitHub environment `qc` lets only
#   `main` use it either.
# - **After Deploy** (`workflow_run`) only when that run succeeded, was a
#   push, to main, of this repo, not a fork's. QC takes nothing from the
#   Deploy run (no artifact, no checkout of its head): it reads keep-qc's
#   /healthz as every run does. Deploy ends when keep-qc is deployed, so
#   staging's deploys never wait behind QC.
# - **KEEP_QC_TOKEN** lives only on the environment `qc`, and only the QC
#   step has it, in its `env`: never in `run:` text, never echoed, never
#   in a browser context (qc/fixtures.ts sends it from Node). GitHub
#   masks it in the log.
# - **Artifacts are public.** Before anything is uploaded, every file is
#   checked for each secret the job's steps can see
#   (scripts/qc-actions/check-artifacts.mjs, which opens traces, zips and
#   the HTML report's data): the QC step for KEEP_QC_TOKEN (the only step
#   that has it), a later step for the job's GitHub token. It fails
#   closed: an upload runs only when every check that covers it said
#   `clean`.
# - **History is only this workflow's own.** The last run's history comes
#   from a completed qc.yml run on main of this repo (never the newest
#   artifact of that name repo-wide, which a pull request's run could
#   upload), read entry by entry without ever writing or following a
#   link, and every line is validated before use (history.sh).
# - **Only main's code runs.** The commit /healthz names must be on main,
#   or the run is void before anything is installed.
# - The token has the least it needs: contents read, issues write (the
#   qc-nightly issue), actions read (the last run's history artifact).
#   Checkouts don't keep it (persist-credentials: false).
#
# The commit: keep-qc's /healthz says which commit it runs, and the job
# checks that one out, so the specs always match the app. If /healthz
# says another commit at the end, the run is void, not failed. Deploys
# and QC share the concurrency group `keep-qc` (deploy.yml's deploy-qc),
# so a deploy waits for a run in progress, and a newer pending run
# replaces an older pending one (GitHub keeps one of each).
#
# Skips, green, while the environment `qc` has no QC_URL (before keep-qc
# is set up), as deploy-qc does.
#
# The verdict (pass, fail, error, void, record) and the issue:
# scripts/qc-actions/report.sh. History: an artifact chain
# (scripts/qc-actions/history.sh). The streak: scripts/qc-actions/
# status.sh. Tested by scripts/qc-actions/workflow.test.mjs.

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: assert, or record (measure only, for recording budgets)
        type: choice
        options: [assert, record]
        default: assert

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  # A run on any ref but main (a dispatch from a branch): fail, loudly,
  # without ever entering the environment.
  refuse:
    if: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: main only
        run: |
          echo "::error::QC runs only on main (this run is on $GITHUB_REF)."
          exit 1

  # After Deploy: only a successful push to main of this repo.
  qc:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: qc
    concurrency:
      group: keep-qc
      cancel-in-progress: false
    steps:
      # QC_URL lives on the environment, so a job-level `if` can't see it:
      # this step decides, and every later step follows.
      - name: keep-qc set up?
        id: gate
        run: |
          if [ -z "$QC_URL" ]; then
            echo "::notice::keep-qc isn't set up yet (no QC_URL on the qc environment): skipping. docs/ops.md \"keep-qc\"."
            echo "go=false" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::QC runs only on main (this run is on $GITHUB_REF)."
            exit 1
          else
            echo "go=true" >>"$GITHUB_OUTPUT"
          fi
        env:
          QC_URL: ${{ vars.QC_URL }}
      - name: Which commit keep-qc runs
        id: commit
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: |
          body=$(curl -fsS --max-time 10 --retry 3 --retry-all-errors "$QC_URL/healthz") || {
            echo "::error::$QC_URL/healthz didn't answer"
            exit 1
          }
          sha=$(jq -r '.commit // empty' <<<"$body")
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$QC_URL/healthz reports no commit (${sha:-none}): was keep-qc deployed by deploy.yml?"
            exit 1
          fi
          echo "keep-qc runs $sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
        env:
          QC_URL: ${{ vars.QC_URL }}
      # The specs and the harness: the commit keep-qc serves.
      - name: Check out keep-qc's commit
        id: checkout
        if: ${{ steps.gate.outputs.go == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          # All of main too, for the check below.
          fetch-depth: 0
          persist-credentials: false
      # Only main's code is installed and run with the token: a commit
      # /healthz names that isn't on main voids the run here, before
      # `pnpm install` runs anything of it (report.sh: reason
      # commit-not-on-main).
      - name: keep-qc's commit is on main
        id: onmain
        if: ${{ steps.gate.outputs.go == 'true' }}
        # merge-base exits 1 for "not an ancestor" and otherwise for a git
        # error: only the first is "not on main" (an alert: a misdeploy or
        # tampering); a git error is an error.
        run: |
          rc=0
          git merge-base --is-ancestor "$SHA" origin/main || rc=$?
          if [ "$rc" = 1 ]; then
            echo "::error::keep-qc runs $SHA, which isn't on main: not running it."
            echo "verdict=not-on-main" >>"$GITHUB_OUTPUT"
            exit 1
          elif [ "$rc" != 0 ]; then
            echo "::error::could not tell whether $SHA is on main (git merge-base exited $rc)."
            exit 1
          fi
        env:
          SHA: ${{ steps.commit.outputs.sha }}
      # This workflow's own scripts, from the workflow's commit, so the
      # steps and the scripts they call always match.
      - name: Check out the workflow's scripts
        id: scripts
        if: ${{ steps.gate.outputs.go == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .qc-actions
          sparse-checkout: scripts/qc-actions
          persist-credentials: false
      - name: Set up pnpm
        id: pnpm
        if: ${{ steps.gate.outputs.go == 'true' }}
        uses: pnpm/action-setup@v4
      - name: Set up node
        id: node
        if: ${{ steps.gate.outputs.go == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: pnpm install
        id: install
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright's browsers
        id: browser-cache
        if: ${{ steps.gate.outputs.go == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Playwright's own chromium, not whatever the runner has at
      # /usr/bin/chromium (playwright.config.ts prefers that one).
      - name: Playwright chromium
        id: browsers
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "QC_CHROMIUM=$(node -p "require('@playwright/test').chromium.executablePath()")" >>"$GITHUB_ENV"
      - name: The last run's history
        id: history
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: .qc-actions/scripts/qc-actions/history.sh fetch "$RUNNER_TEMP/qc-prev"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # QC, the trend report, then the artifact token check. The only step
      # with the token: in its env, inherited by `pnpm qc` and the check.
      - name: QC
        id: qc
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: .qc-actions/scripts/qc-actions/run.sh "$RUNNER_TEMP/qc-prev"
        env:
          KEEP_QC_TOKEN: ${{ secrets.KEEP_QC_TOKEN }}
          QC_TARGET_URL: ${{ vars.QC_URL }}
          QC_MODE: ${{ inputs.mode == 'record' && 'record' || 'assert' }}
      - name: Verdict
        id: report
        if: ${{ always() && steps.gate.outputs.go == 'true' }}
        run: .qc-actions/scripts/qc-actions/report.sh
        env:
          QC_URL: ${{ vars.QC_URL }}
          COMMIT: ${{ steps.commit.outputs.sha }}
          MODE: ${{ inputs.mode == 'record' && 'record' || 'assert' }}
          STEPS: >-
            commit=${{ steps.commit.outcome }}
            checkout=${{ steps.checkout.outcome }}
            onmain=${{ steps.onmain.outcome }}
            scripts=${{ steps.scripts.outcome }}
            pnpm=${{ steps.pnpm.outcome }}
            node=${{ steps.node.outcome }}
            install=${{ steps.install.outcome }}
            browser-cache=${{ steps.browser-cache.outcome }}
            browsers=${{ steps.browsers.outcome }}
            history=${{ steps.history.outcome }}
          ONMAIN: ${{ steps.onmain.outputs.verdict }}
          HISTORY_CHAIN: ${{ steps.history.outputs.chain }}
          QC_OUTCOME: ${{ steps.qc.outcome }}
          QC_EXIT: ${{ steps.qc.outputs.exit }}
          QC_FLOWS: ${{ steps.qc.outputs.flows }}
          QC_OVER: ${{ steps.qc.outputs.over }}
          QC_RTT: ${{ steps.qc.outputs.rtt }}
          QC_RTTOVER: ${{ steps.qc.outputs.rttover }}
          QC_RETRIES: ${{ steps.qc.outputs.retries }}
          QC_UNBUDGETED: ${{ steps.qc.outputs.unbudgeted }}
          QC_FAILED: ${{ steps.qc.outputs.failed }}
          QC_CHECK: ${{ steps.qc.outputs.check }}
          HISTORY_FETCHED: ${{ steps.history.outcome == 'success' }}
          PREV: ${{ runner.temp }}/qc-prev
          OUT: ${{ runner.temp }}/qc-history
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # Everything that may go up, checked for the job's GitHub token (the
      # verdict step had it). The QC step checked for KEEP_QC_TOKEN.
      - name: Check the uploads for the GitHub token
        id: ghcheck
        if: ${{ always() && steps.gate.outputs.go == 'true' }}
        run: .qc-actions/scripts/qc-actions/check-uploads.sh "$RUNNER_TEMP/qc-history"
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SECRETS: GH_TOKEN
      # Uploads: only what every check cleared. A check that refused, or
      # never ran, leaves `check` unset or not `clean`: nothing goes up.
      - name: Upload qc-results
        if: ${{ always() && steps.qc.outputs.check == 'clean' && steps.ghcheck.outputs.check == 'clean' }}
        uses: actions/upload-artifact@v4
        with:
          name: qc-results
          path: qc-results/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true
      - name: Upload qc-report
        if: ${{ always() && steps.qc.outputs.check == 'clean' && steps.ghcheck.outputs.check == 'clean' }}
        uses: actions/upload-artifact@v4
        with:
          name: qc-report
          path: qc-report/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true
      # The next link of the history chain (report.sh built it): this
      # run's history only if the check cleared it, else the last run's,
      # plus this run's runs.log line. Not when the last one couldn't be
      # read (an empty one uploaded as the newest would cut the chain),
      # nor when the QC step's check refused (the last run's history,
      # seeded into qc-results/, was checked with it): the chain then
      # goes on from the link before.
      - name: Upload qc-history
        if: ${{ always() && steps.history.outcome == 'success' && steps.qc.outputs.check != 'refused' && steps.ghcheck.outputs.check == 'clean' }}
        uses: actions/upload-artifact@v4
        with:
          name: qc-history
          path: ${{ runner.temp }}/qc-history/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
