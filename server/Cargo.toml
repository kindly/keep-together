[workspace]
resolver = "3"
members = ["crates/*"]
# Claude Code drops a `.claude/` folder in a directory a session works in;
# under crates/ the glob would take it for a crate.
exclude = ["crates/.claude"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
store = { path = "crates/store" }
contracts = { path = "crates/contracts" }
contacts = { path = "crates/contacts" }
api = { path = "crates/api" }
platform = { path = "crates/platform" }
auth = { path = "crates/auth" }
sources = { path = "crates/sources" }
giving = { path = "crates/giving" }
giftaid = { path = "crates/giftaid" }
comms = { path = "crates/comms" }
cli = { path = "crates/cli" }
seed = { path = "crates/seed" }
axum = "0.8.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "limits", "hooks"] }
rusqlite_migration = "2.6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
unicode-normalization = "0.1"
uuid = { version = "1.29", features = ["v4", "v7"] }

tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# Password hashing is deliberately slow; unoptimised it makes every test
# that signs in take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
